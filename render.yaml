# Render Blueprint: one click creates the web service AND the PostgreSQL database.
databases:
  - name: securebank-db
    plan: free
    databaseName: securebank
    user: securebank

services:
  - type: web
    name: securebank
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securebank-db
          property: connectionString
      - key: ADMIN_KEY
        value: admin123        # change this after deploying!
      - key: SEED_DEMO
        value: "true"          # creates 4 demo accounts on first start
